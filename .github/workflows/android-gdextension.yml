name: Build Android GDExtension

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-gdextension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip scons
          sdkmanager "platform-tools" "platforms;android-26" "build-tools;35.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Fetch matching godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: 4.3
          path: godot-cpp
          submodules: recursive

      - name: Build godot-cpp for Android arm64
        run: |
          scons -C godot-cpp platform=android target=template_debug arch=arm64

      - name: Build UVE GDExtension
        run: |
          scons platform=android arch=arm64 target=template_debug godot_cpp="$GITHUB_WORKSPACE/godot-cpp"
          test -s addons/uve_animation/bin/libuve_animation.android.arm64.so

      - name: Validate GDExtension manifest
        run: |
          python - <<'PY'
          import configparser
          p = configparser.ConfigParser()
          p.read('addons/uve_animation/config/uve_animation.gdextension')
          assert p['configuration']['entry_symbol'] == 'uve_animation_library_init'
          assert 'android.arm64' in p['libraries']
          print('GDExtension manifest: ok')
          PY

      - name: Package Android plugin
        run: |
          mkdir -p dist/uve_animation_android/addons/uve_animation/bin dist/uve_animation_android/addons/uve_animation/config
          cp addons/uve_animation/plugin.cfg dist/uve_animation_android/addons/uve_animation/
          cp addons/uve_animation/config/uve_animation.gdextension dist/uve_animation_android/addons/uve_animation/config/
          cp addons/uve_animation/bin/libuve_animation.android.arm64.so dist/uve_animation_android/addons/uve_animation/bin/
          cp addons/uve_animation/scripts/*.gd dist/uve_animation_android/addons/uve_animation/
          tar -czf uve-animation-android-arm64.tar.gz -C dist uve_animation_android

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: uve-animation-android-arm64
          path: uve-animation-android-arm64.tar.gz
          if-no-files-found: error
